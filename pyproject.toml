[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apara0323-chipadapt_jd427"
version = "0.1.0"
description = "解析时间标记，排列推理芯片适配工程师·GPU 故障与作业自愈的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "apara0323" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://apara0323.github.io"
Repository = "https://github.com/apara0323/chipadapt_jd427"
Issues = "https://github.com/apara0323/chipadapt_jd427/issues"

[project.scripts]
chipadapt_jd427 = "chipadapt_jd427:main"

[tool.setuptools]
py-modules = ["chipadapt_jd427"]
